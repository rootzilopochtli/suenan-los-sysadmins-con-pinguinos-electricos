---
# 1. La Granja de Procesamiento (El Backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaia-backend
  labels:
    app: gaia-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaia-backend
  template:
    metadata:
      labels:
        app: gaia-backend
    spec:
      containers:
        - name: fastapi
          image: localhost/gaia-backend:v1
          imagePullPolicy: Never  # Usa la imagen precargada localmente (modo Airgap/Edge)
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status/db
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gaia-db-secret
                  key: POSTGRESQL_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: gaia-db-secret
                  key: POSTGRESQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: gaia-db-secret
                  key: POSTGRESQL_DATABASE
            - name: DB_HOST
              value: "gaia-db-service"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
# 2. El Servicio Interno
apiVersion: v1
kind: Service
metadata:
  name: gaia-backend-service
  labels:
    app: gaia-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: gaia-backend

---
# 3. HPA Interno (Nivel 0 - Auto-escalado reactivo)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gaia-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gaia-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
