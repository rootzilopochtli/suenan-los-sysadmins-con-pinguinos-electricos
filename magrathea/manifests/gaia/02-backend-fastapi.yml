---
# 1. La Granja de Procesamiento (El Backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaia-backend
  labels:
    app: gaia-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gaia-backend
  template:
    metadata:
      labels:
        app: gaia-backend
    spec:
      containers:
        - name: fastapi
          image: localhost/gaia-backend:v1
          imagePullPolicy: Never  # <-- Fundamental: Le dice a K8s que no busque en internet, que use la caché local
          ports:
            - containerPort: 8000
          env:
            # Mapeamos las llaves del Secreto de Bitnami a las variables que Python espera
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gaia-db-secret
                  key: POSTGRESQL_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: gaia-db-secret
                  key: POSTGRESQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: gaia-db-secret
                  key: POSTGRESQL_DATABASE
            - name: DB_HOST
              value: "gaia-db-service"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
# 2. El Servicio Interno
apiVersion: v1
kind: Service
metadata:
  name: gaia-backend-service
  labels:
    app: gaia-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: gaia-backend
