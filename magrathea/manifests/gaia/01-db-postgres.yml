---
apiVersion: v1
kind: Secret
metadata:
  name: gaia-db-secret
  labels:
    app: gaia-db
type: Opaque
stringData:
  POSTGRESQL_USER: "sysadmin"
  POSTGRESQL_PASSWORD: "positronic_password"
  POSTGRESQL_DATABASE: "terminus_data"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gaia-db-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-edge-storage
  hostPath:
    path: "/var/lib/terminus-data"
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gaia-db-pvc
  labels:
    app: gaia-db
spec:
  storageClassName: manual-edge-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gaia-db
  labels:
    app: gaia-db
spec:
  serviceName: "gaia-db-service"
  replicas: 1
  selector:
    matchLabels:
      app: gaia-db
  template:
    metadata:
      labels:
        app: gaia-db
    spec:
      securityContext:
        fsGroup: 26
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: tcp-postgresql
          envFrom:
            - secretRef:
                name: gaia-db-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: gaia-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: gaia-db-service
  labels:
    app: gaia-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: gaia-db
